{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a href="?page={{ page_obj.previous_page_number }}{% if q %}&amp;q={{ q|urlencode }}{% endif %}" rel="prev">Previous</a>
  {% endif %}
  <span class="current" aria-current="page">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a href="?page={{ page_obj.next_page_number }}{% if q %}&amp;q={{ q|urlencode }}{% endif %}" rel="next">Next</a>
  {% endif %}
</nav>
<p class="pagination-info">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</p>
{% endif %}
