<div id="cv-active"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  {% if active_cv %}
  <div class="version-item">
    <div class="version-info">
      <strong>{{ active_cv.original_name }}</strong>
      <span>{{ active_cv.uploaded_at|date:"d M Y, H:i" }} &middot; {{ active_cv.size_display }}</span>
    </div>
    <span class="badge badge-success">Active</span>
  </div>
  <div class="form-actions">
    <a class="btn btn-small" href="{% url 'portfolio:cv_file' %}" target="_blank" rel="noopener noreferrer">Open PDF</a>
    <a class="btn btn-small btn-ghost" href="{% url 'portfolio:cv_download' %}">Download</a>
  </div>
  {% else %}
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>
    <h2>No CV uploaded</h2>
    <p>The public CV page is currently using the bundled fallback, if one exists.</p>
  </div>
  {% endif %}
</div>
